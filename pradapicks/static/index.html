<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pradapicks — AI Prop Engine</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131826;
    --panel-2: #1a2030;
    --border: #232a3d;
    --text: #e6ebf5;
    --muted: #8892a8;
    --accent: #4cc9f0;
    --good: #38d39f;
    --warn: #f7b955;
    --bad: #ef476f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 28px 32px 16px;
    background: linear-gradient(180deg, #0e1320 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em;
  }
  header h1 span { color: var(--accent); }
  header .tagline { color: var(--muted); font-size: 13px; }
  header .stats {
    display: flex; gap: 18px; flex-wrap: wrap;
  }
  header .stats .pill {
    background: var(--panel); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px; font-size: 12px;
    color: var(--muted);
  }
  header .stats .pill b { color: var(--text); margin-left: 4px; }
  main { padding: 24px 32px 64px; max-width: 1320px; margin: 0 auto; }
  .row { display: grid; gap: 20px; grid-template-columns: 2fr 1fr; }
  @media (max-width: 980px) { .row { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .card h2 {
    margin: 0 0 14px; font-size: 16px; font-weight: 600; color: var(--text);
    display: flex; justify-content: space-between; align-items: center;
  }
  .card h2 .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
  .filters { display: flex; gap: 6px; margin-bottom: 14px; }
  .filters button {
    background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
    transition: all 0.15s;
  }
  .filters button:hover { color: var(--text); }
  .filters button.active { background: var(--accent); color: #0b0e14; border-color: var(--accent); }
  .pick-row {
    display: grid;
    grid-template-columns: 36px 1fr auto auto;
    gap: 14px; align-items: center;
    padding: 12px 0; border-top: 1px solid var(--border);
  }
  .pick-row:first-child { border-top: 0; }
  .rating-circle {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #0b0e14;
  }
  .player { font-weight: 600; font-size: 14px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pick-side {
    text-align: right; font-weight: 600; font-size: 13px;
  }
  .pick-side .side-over { color: var(--good); }
  .pick-side .side-under { color: var(--warn); }
  .price { color: var(--muted); font-size: 12px; }
  .edge {
    font-variant-numeric: tabular-nums; font-size: 12px;
    color: var(--good); text-align: right;
  }
  .edge.neg { color: var(--bad); }
  .badge {
    display: inline-block; padding: 1px 6px; border-radius: 4px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
    background: var(--panel-2); color: var(--muted); margin-left: 6px;
  }
  .badge.MLB { background: #1a3447; color: #67d3f5; }
  .badge.NBA { background: #3a1e47; color: #d68dff; }
  .badge.NHL { background: #1a2f47; color: #8db7ff; }
  .empty { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }
  /* bet slip form */
  form.slip { display: flex; flex-direction: column; gap: 10px; }
  form.slip .leg {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; display: grid;
    grid-template-columns: 60px 1fr 70px 70px 70px 70px 24px;
    gap: 6px; align-items: center;
  }
  form.slip input, form.slip select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; width: 100%;
  }
  form.slip .add-leg, form.slip .submit {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  form.slip .submit { background: var(--accent); color: #0b0e14; border-color: var(--accent); font-weight: 600; }
  form.slip .remove {
    background: transparent; color: var(--muted); border: 0; cursor: pointer; font-size: 16px;
  }
  .slip-result {
    margin-top: 14px; padding: 12px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    font-size: 12px;
  }
  .slip-result .verdict { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .progress-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  }
  .progress-grid .stat {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px;
  }
  .progress-grid .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .progress-grid .stat .value { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 32px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Prada<span>picks</span></h1>
    <div class="tagline">AI prop scoring · MLB · NBA · NHL · auto-trained, auto-graded</div>
  </div>
  <div class="stats" id="status-pills">
    <span class="pill">Status <b id="status-text">…</b></span>
    <span class="pill">Models <b id="status-models">—</b></span>
    <span class="pill">Picks today <b id="status-picks">—</b></span>
    <span class="pill">Offers today <b id="status-offers">—</b></span>
  </div>
</header>

<main>

<div class="row">
  <!-- LEFT: today's picks -->
  <section class="card">
    <h2>
      Top Props of the Day
      <span class="sub" id="picks-meta">—</span>
    </h2>
    <div class="filters" id="filters">
      <button data-sport="" class="active">All</button>
      <button data-sport="MLB">MLB</button>
      <button data-sport="NBA">NBA</button>
      <button data-sport="NHL">NHL</button>
    </div>
    <div id="picks"></div>
  </section>

  <!-- RIGHT: bet slip + progress -->
  <aside style="display:flex; flex-direction:column; gap:20px;">
    <section class="card">
      <h2>Bet Slip Analyzer <span class="sub">DK · FD · MGM · PrizePicks</span></h2>
      <form class="slip" id="slip-form">
        <div id="legs"></div>
        <div style="display:flex; gap:8px; justify-content:space-between;">
          <button type="button" class="add-leg" id="add-leg">+ Add Leg</button>
          <button type="submit" class="submit">Analyze</button>
        </div>
      </form>
      <div id="slip-result"></div>
    </section>

    <section class="card">
      <h2>Progress (last 30 days)</h2>
      <div class="progress-grid" id="progress"></div>
    </section>
  </aside>
</div>

<div class="footer">
  Pradapicks v0.1 · <a href="/docs">API docs</a> · <a href="/health">health</a> · model self-improves nightly
</div>

</main>

<script>
const $ = (s) => document.querySelector(s);
const fmtPrice = (n) => (n > 0 ? `+${n}` : `${n}`);
const ratingColor = (r) => {
  if (r >= 75) return "#38d39f";
  if (r >= 55) return "#4cc9f0";
  if (r >= 35) return "#f7b955";
  return "#7a8499";
};
const marketLabel = (m) => ({
  player_points: "Points", player_rebounds: "Rebounds", player_assists: "Assists",
  player_threes: "Threes", player_pra: "PRA", player_pa: "Pts+Ast",
  player_pr: "Pts+Reb", player_ra: "Reb+Ast",
  player_steals: "Steals", player_blocks: "Blocks", player_turnovers: "Turnovers",
  batter_hits: "Hits", batter_total_bases: "Total Bases",
  batter_home_runs: "HRs", batter_rbis: "RBIs", batter_runs_scored: "Runs",
  batter_strikeouts: "Strikeouts", pitcher_strikeouts: "Pitcher Ks",
  pitcher_outs: "Outs Recorded", pitcher_earned_runs: "Earned Runs",
  pitcher_hits_allowed: "Hits Allowed",
  player_shots_on_goal: "Shots On Goal", player_goals: "Goals",
  goalie_saves: "Saves", goalie_goals_against: "Goals Against",
}[m] || m);

let allPicks = [];
let currentSport = "";

async function loadHealth() {
  try {
    const r = await fetch("/health");
    const j = await r.json();
    $("#status-text").textContent = j.bootstrapping ? "Bootstrapping…" : "Live";
    $("#status-models").textContent = j.active_models ?? "—";
    $("#status-picks").textContent = j.picks_today ?? "—";
    $("#status-offers").textContent = j.offers_today ?? "—";
  } catch (e) { $("#status-text").textContent = "offline"; }
}

async function loadPicks() {
  try {
    const r = await fetch("/picks/today");
    const j = await r.json();
    allPicks = j.picks || [];
    $("#picks-meta").textContent = `${j.date} · ${allPicks.length} picks`;
    renderPicks();
  } catch (e) {
    $("#picks").innerHTML = `<div class="empty">Couldn't load picks: ${e}</div>`;
  }
}

function renderPicks() {
  const filtered = currentSport ? allPicks.filter(p => p.sport === currentSport) : allPicks;
  const el = $("#picks");
  if (!filtered.length) {
    el.innerHTML = `<div class="empty">
      No picks yet. The system is still bootstrapping or live odds are unavailable —
      synthetic picks will publish automatically once the model has trained.
    </div>`;
    return;
  }
  el.innerHTML = filtered.map(p => `
    <div class="pick-row">
      <div class="rating-circle" style="background:${ratingColor(p.rating)}">${Math.round(p.rating)}</div>
      <div>
        <div class="player">${p.player_name} <span class="badge ${p.sport}">${p.sport}</span></div>
        <div class="meta">${marketLabel(p.market)} · ${p.team || "—"} ${p.opponent ? "vs " + p.opponent : ""} · ${p.book}</div>
      </div>
      <div class="pick-side">
        <span class="side-${p.side}">${p.side.toUpperCase()} ${p.line}</span>
        <div class="price">${fmtPrice(p.price_american)}</div>
      </div>
      <div class="edge ${p.edge_pct < 0 ? "neg" : ""}">
        ${p.edge_pct >= 0 ? "+" : ""}${p.edge_pct.toFixed(1)}%
        <div class="meta" style="text-align:right">model ${(p.model_prob*100).toFixed(0)}%</div>
      </div>
    </div>
  `).join("");
}

async function loadProgress() {
  try {
    const r = await fetch("/progress?days=30");
    const j = await r.json();
    const stats = [
      ["Picks", j.picks ?? 0],
      ["Hit Rate", j.hit_rate != null ? (j.hit_rate * 100).toFixed(1) + "%" : "—"],
      ["P/L (units)", j.pl_units ?? "—"],
      ["ROI", j.roi_pct != null ? j.roi_pct.toFixed(1) + "%" : "—"],
    ];
    $("#progress").innerHTML = stats.map(([l, v]) => `
      <div class="stat"><div class="label">${l}</div><div class="value">${v}</div></div>
    `).join("");
  } catch (e) {}
}

// ---- Bet slip form ----
function legHtml(i) {
  return `
    <div class="leg" data-i="${i}">
      <select name="sport"><option>NBA</option><option>MLB</option><option>NHL</option></select>
      <input name="player_name" placeholder="Player name" required />
      <input name="market" placeholder="market" value="player_points" />
      <input name="line" placeholder="line" type="number" step="0.5" required />
      <select name="side"><option>over</option><option>under</option></select>
      <input name="price_american" placeholder="-110" type="number" required />
      <button type="button" class="remove" onclick="this.closest('.leg').remove()">×</button>
    </div>`;
}
let legCount = 0;
$("#add-leg").addEventListener("click", () => {
  $("#legs").insertAdjacentHTML("beforeend", legHtml(++legCount));
});
$("#add-leg").click();

$("#slip-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const legs = [...document.querySelectorAll("#legs .leg")].map(leg => {
    const o = {};
    leg.querySelectorAll("input,select").forEach(i => o[i.name] = i.value);
    o.line = parseFloat(o.line);
    o.price_american = parseInt(o.price_american);
    return o;
  });
  $("#slip-result").innerHTML = `<div class="slip-result">Analyzing…</div>`;
  try {
    const r = await fetch("/betslip/analyze", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({legs, book: "user"}),
    });
    const j = await r.json();
    $("#slip-result").innerHTML = `
      <div class="slip-result">
        <div class="verdict" style="color:${ratingColor(j.rating)}">${j.verdict} · ${j.rating}/100</div>
        <div>Combined odds: ${fmtPrice(j.combined_american_odds)} (${j.combined_decimal_odds.toFixed(2)})</div>
        <div>Model prob: ${(j.combined_model_prob*100).toFixed(2)}%  ·  Implied: ${(j.combined_implied_prob*100).toFixed(2)}%</div>
        <div>Edge: ${j.combined_edge_pct >= 0 ? "+" : ""}${j.combined_edge_pct.toFixed(2)}%</div>
        <div style="margin-top:6px; color:var(--muted)">${j.legs.length} legs analyzed</div>
      </div>`;
  } catch (e) {
    $("#slip-result").innerHTML = `<div class="slip-result">Error: ${e}</div>`;
  }
});

// Filter buttons
document.querySelectorAll("#filters button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("#filters button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    currentSport = b.dataset.sport;
    renderPicks();
  });
});

loadHealth(); loadPicks(); loadProgress();
setInterval(loadHealth, 30_000);
setInterval(loadPicks, 120_000);
setInterval(loadProgress, 120_000);
</script>
</body>
</html>
