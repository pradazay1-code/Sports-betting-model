services:
  - type: web
    name: pradapicks-api
    env: python
    plan: starter
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn pradapicks.api:app -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT --timeout 600"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: pradapicks-db
          property: connectionString
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: RUN_SCHEDULER
        value: "true"
      - key: AUTO_BOOTSTRAP_DAYS
        value: "30"
      - key: TZ
        value: America/New_York

databases:
  - name: pradapicks-db
    plan: starter
    postgresMajorVersion: 16
