name: deploy-pages

on:
  push:
    # Default branch is currently `claude/sports-betting-model-tTevm`; we list
    # both so this keeps working if you later rename to `main`.
    branches:
      - main
      - "claude/sports-betting-model-tTevm"
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # enablement: true lets this workflow turn on GitHub Pages (build type
        # "workflow") via the API on first run, so no manual Settings -> Pages
        # step is needed. Requires the pages: write permission set above.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
