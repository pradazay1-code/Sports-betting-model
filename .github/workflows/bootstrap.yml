name: bootstrap

# Manual one-shot: backfill historical box scores, train every model, and
# generate the first set of picks. Run this once after enabling Actions.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to backfill"
        required: false
        default: "45"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m app.pipeline bootstrap ${{ inputs.days }}
      - name: Commit
        run: |
          git config user.name  "pradapicks-bot"
          git config user.email "pradapicks-bot@users.noreply.github.com"
          git add data models docs || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "auto: bootstrap (${{ inputs.days }} days) $(date -u +%F)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
