name: daily-picks

on:
  # 13:00 UTC = 09:00 ET (DST) / 08:00 ET (standard).
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pradapicks-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily picks pipeline
        run: python -m app.pipeline daily
      - name: Commit data + dashboard
        run: |
          git config user.name  "pradapicks-bot"
          git config user.email "pradapicks-bot@users.noreply.github.com"
          git add data models docs || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: daily picks $(date -u +%F)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
