name: nightly-grade-and-retrain

on:
  # 08:00 UTC = 04:00 ET (DST) / 03:00 ET (standard).
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pradapicks-pipeline
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m app.pipeline nightly
      - name: Commit
        run: |
          git config user.name  "pradapicks-bot"
          git config user.email "pradapicks-bot@users.noreply.github.com"
          git add data models docs || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "auto: nightly grade + retrain $(date -u +%F)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
