name: refresh-odds

on:
  # Every 2 hours between 14:00 and 02:00 UTC (covers the US slate).
  schedule:
    - cron: "0 14,16,18,20,22,0,2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pradapicks-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m app.pipeline odds
      - name: Commit
        run: |
          git config user.name  "pradapicks-bot"
          git config user.email "pradapicks-bot@users.noreply.github.com"
          git add data docs || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "auto: odds refresh $(date -u +'%F %H:%MZ')"
            git push
          fi
