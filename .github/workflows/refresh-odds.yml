name: refresh-odds

on:
  # Every 2 hours between 14:00 and 02:00 UTC (covers the US slate).
  schedule:
    # Hourly across the active US/EU sports window (14:00–04:00 UTC) so picks
    # and alerts fire close to real time. Widen/narrow to taste; each run uses
    # a few Odds-API credits, so hourly keeps the free tier (500/mo) viable.
    - cron: "0 14-23,0-4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pradapicks-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      NOTIFY_NTFY_TOPIC: ${{ secrets.NOTIFY_NTFY_TOPIC }}
      NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
      NOTIFY_EMAIL_APP_PASSWORD: ${{ secrets.NOTIFY_EMAIL_APP_PASSWORD }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      NOTIFY_MIN_GRADE: ${{ vars.NOTIFY_MIN_GRADE || 'A-' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m app.pipeline odds
      - name: Commit
        run: |
          git config user.name  "pradapicks-bot"
          git config user.email "pradapicks-bot@users.noreply.github.com"
          git add data docs || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "auto: odds refresh $(date -u +'%F %H:%MZ')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
